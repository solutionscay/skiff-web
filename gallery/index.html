      <figcaption><span class="tag">v1.9.4</span>Linux<span class="date">Nov 3, 2026</span><p>Mission control. Admiral is at the top left. Each fleet and project is a tree in a fixed grid, and each Skipper has a window with its face. The lines are solid and take the state color. Amber marks the agents that wait for you.</p></figcaption>
    </figure>
    <figure>
      <a class="shot" href="../shots/v1.9.4-mission-control-hero.webp"><img src="../shots/v1.9.4-mission-control-hero.webp" width="1600" height="900" loading="lazy" alt="Skiff v1.9.4 on Linux: Mission control zoomed in. Admiral's window shows the Skiff mascot's head and the state working. Lines run down to the Harbor, Driftwood and tidepool-web Skipper windows, each with its own face and color. Under them, the cards for the sessions are amber with a bell, except one blue card in Harbor that works."></a>
      <figcaption><span class="tag">v1.9.4</span>Linux<span class="date">Nov 3, 2026</span><p>The same board, zoomed in. A Skipper's window shows its state, its task and its counts. The cards under it show the sessions. A waiting card has a bell and an amber frame.</p></figcaption>
    </figure>
    <figure>
      <a class="shot" href="../shots/v1.9.4-boxed-sidebar.webp"><img src="../shots/v1.9.4-boxed-sidebar.webp" width="1600" height="900" loading="lazy" alt="Skiff v1.9.4 on Linux: the side panel in the Tree view. The projects in no fleet sit in a PROJECTS box, and the Harbor fleet has a box of its own with its Skipper. Admiral's row at the top is the largest, the fleet Skipper's row is smaller and the project Skippers' rows are the smallest. Bells mark the sessions that wait. Admiral's pane is in the center. The Ledger on the right lists the tasks, and the waiting ones read asks approval."></a>
      <figcaption><span class="tag">v1.9.4</span>Linux<span class="date">Nov 3, 2026</span><p>The side panel with a box for each fleet and for the projects in no fleet. The Skipper rows step down in size: Admiral, a fleet Skipper, a project Skipper. A bell marks a session that waits.</p></figcaption>
    </figure>

      <figcaption><span class="tag">v1.9.4</span>Linux<span class="date">Nov 3, 2026</span><p>The Skippers view. Admiral comes first, then each Skipper with its face, its latest task and the time. Fleet Skippers carry a fleet tag. Ctrl+Shift+Alt+S switches between this view and the tree.</p></figcaption>
    </figure>
    <figure>
      <a class="shot" href="../shots/v1.9.4-welcome.webp"><img src="../shots/v1.9.4-welcome.webp" width="1600" height="900" loading="lazy" alt="Skiff v1.9.4 on Linux, on first start. The side panel shows the Admiral row and an empty PROJECTS head. The main area reads Add your first project, with an Add project button and an Admiral button, and a line that says Admiral starts and tracks agents for you."></a>
      <figcaption><span class="tag">v1.9.4</span>Linux<span class="date">Nov 3, 2026</span><p>First start, with no project. Add project opens the folder dialog. The Admiral button starts the Skiff agent, which needs no project.</p></figcaption>
    </figure>

      <figcaption><span class="tag">v1.9.4</span>Linux<span class="date">Nov 3, 2026</span><p>First start when no agent is on the PATH. The Admiral button becomes Agent settings, and the window says why.</p></figcaption>

      <figcaption><span class="tag">v1.8.6</span>Linux<span class="date">Oct 30, 2026</span><p>The Skippers list. Each Skipper has its own face, and Admiral wears the Skiff mascot's head. Ctrl+Shift+L switches the side panel between the tree and the list.</p></figcaption>

      <figcaption><span class="tag">v1.8.6</span>Linux<span class="date">Oct 30, 2026</span><p>The tree. Each Skipper's face sits at the start of its row, and each session shows its agent's icon.</p></figcaption>
    </figure>
    <figure>

      <figcaption><span class="tag">v1.8.6</span>Linux<span class="date">Oct 30, 2026</span><p>Mission control. The Admiral and Skipper cards show their faces. A string runs from each owner to its tasks.</p></figcaption>
    </figure>
    <figure>

      <figcaption><span class="tag">v1.8.6</span>Linux<span class="date">Oct 30, 2026</span><p>Admiral hands three tasks to the Skippers. Mission control shows the whole crew as a graph: the strings follow the ledger.</p></figcaption>
    </figure>

      <figcaption><span class="tag">v1.8.6</span>Linux<span class="date">Oct 30, 2026</span><p>Avatar… on a Skipper's menu. Click one of twelve faces to set it. Shuffle shows twelve more.</p></figcaption>

      <figcaption><span class="tag">Skipper avatars</span>Promo<span class="date">Oct 30, 2026</span><p>Skipper avatars, new in v1.8.6. Every Skipper gets a face. Click a face to set it, or click Shuffle to see more. The face shows in the tree, in the Skippers list (Ctrl+Shift+L) and on the Mission control cards (Ctrl+Shift+A).</p></figcaption>
    </figure>
    <figure>

      <figcaption><span class="tag">v1.7.4</span>Illustration<span class="date">Oct 27, 2026</span><p>New in 1.7.4: any folder can be a project. One Skipper hands work to agents across git repos and plain folders.</p></figcaption>

      <figcaption><span class="tag">Image drops</span>Promo<span class="date">Oct 26, 2026</span><p>Drop or paste images on any pane, and Skiff types their paths. All sessions share one library. From it you insert, pin or copy the path of an image.</p></figcaption>

      <figcaption><span class="tag">v1.7.1</span>Linux<span class="date">Oct 26, 2026</span><p>Images. Drop or paste an image on a pane, and Skiff types its path. The library keeps each image. Search it, pin an image or insert its path into a pane.</p></figcaption>

    <figure>

      <figcaption><span class="tag">v1.7.1</span>Linux<span class="date">Oct 26, 2026</span><p>Fleet Skippers. A fleet has its own Skipper for all its projects. Skipper hands it work, and the Ledger shows the tasks in each project.</p></figcaption>

      <figcaption><span class="tag">v1.7.1</span>Linux<span class="date">Oct 26, 2026</span><p>Settings › Images shows all the images. Select one or more, then open, insert, pin, copy or delete them.</p></figcaption>

      <figcaption><span class="tag">v1.7.0</span>Linux<span class="date">Oct 24, 2026</span><p>Project Skippers. A project has its own Skipper. The main Skipper hands it work, and the Ledger shows the hand-off and its tasks.</p></figcaption>
