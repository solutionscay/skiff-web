# After each GitHub Pages deploy, send the pages that changed to IndexNow.
# page_build fires when the legacy Pages build from main finishes. (workflow_run on
# GitHub's dynamic "pages build and deployment" run does not fire.)
name: IndexNow
on:
  page_build:
  workflow_dispatch:
    inputs:
      all:
        description: "Send every URL in sitemap.xml"
        type: boolean
        default: false
permissions:
  contents: read
  pages: read
jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.build.commit || github.sha }}
          fetch-depth: 0
      - name: Send the changed URLs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.build.commit }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ]; then
            python3 tools/indexnow.py --all --wait
            exit 0
          fi
          # The commit of the deploy before this one, from the Pages build list.
          PREV=$(gh api "repos/${{ github.repository }}/pages/builds?per_page=20" \
            --jq "[.[] | select(.status == \"built\") | .commit] | (index(\"${SHA:-$GITHUB_SHA}\") // -1) as \$i | if \$i >= 0 then .[\$i + 1] else .[0] end // empty")
          if [ -z "$PREV" ]; then PREV="${SHA:-$GITHUB_SHA}~1"; fi
          # The first deploy with the key sends every URL: the key and this
          # workflow change no sitemap date, so the changed list would be short.
          KEY=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | head -n 1)
          if ! git cat-file -e "$PREV:$KEY" 2>/dev/null; then
            echo "$PREV has no $KEY: first deploy with IndexNow, sending every URL"
            python3 tools/indexnow.py --all --wait
            exit 0
          fi
          echo "Changes since $PREV"
          python3 tools/indexnow.py --since "$PREV" --wait
