<!doctype html>
<!-- Source of social-preview.png (1280x640, the og:image of every page and the
     GitHub social preview). Edit the text here, then run:

         python3 tools/social-preview.py

     The left panel is tools/social-preview-mascot.png: the idle pose on the
     bg-deep colour, 560x640, kept from the first render. Colours and fonts follow
     site.css. Text stays inside GitHub's 40px safe margin. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { display: flex; background: #0f1216; color: #e6e8eb; font-family: "IBM Plex Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .mascot { width: 560px; height: 640px; background: #0b0e12; border-right: 1px solid #232a33; }
  .mascot img { display: block; }
  .copy { flex: 1; padding: 0 40px 24px 72px; display: flex; flex-direction: column; }
  .text { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 8px; }
  .rule { width: 56px; height: 7px; background: #b69cff; margin-bottom: 30px; }
  .mark { font-family: "Lilita One", sans-serif; font-weight: 400; font-size: 112px; line-height: 1; letter-spacing: 0.02em; text-transform: uppercase; color: #e6e8eb; margin-bottom: 28px; }
  h1 { font-size: 44px; line-height: 1.12; font-weight: 700; letter-spacing: -0.01em; color: #e6e8eb; margin-bottom: 22px; }
  p { font-size: 25px; line-height: 1.45; font-weight: 400; color: #9aa3ae; }
  .crew { display: flex; gap: 14px; margin-top: 34px; }
  .crew .skipper-face { width: 52px; height: 52px; }
  .crew svg { display: block; width: 100%; height: 100%; }
  .foot { height: 62px; border-top: 1px solid #232a33; display: flex; align-items: center; gap: 12px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 21px; color: #9aa3ae; }
  .foot i { width: 9px; height: 9px; background: #b69cff; }
</style>
</head>
<body>
<div class="mascot"><img src="social-preview-mascot.png" alt="" width="560" height="640"></div>
<div class="copy">
  <div class="text">
    <div class="rule"></div>
    <div class="mark">Skiff</div>
    <h1>The multi-agent<br>coding terminal.</h1>
    <p>Run Claude Code, Codex and other agents in parallel.<br>They send each other tasks and report back.</p>
    <!-- crew -->
    <div class="crew" role="img" aria-label="The Skiff crew: Admiral and five Skippers">
      <span class="skipper-face" style="--pc:#8eb4ff"><svg viewBox="0 0 32 32" aria-hidden="true" style="--blink:4.1s;--blink-delay:-0.30s;--blink-anim:sk-blink;--face-turn:45s;--face-turn-delay:-12.00s;--dir:1"><g class="sk-turn"><rect x="2.4" y="10.6" width="27.2" height="19.4" rx="8" fill="#fff" stroke="#192230" stroke-width="1.6" stroke-linejoin="round"/><g class="sk-cap"><path d="M4.6 9.4C5.4 4.6 10 2 16 2s10.6 2.6 11.4 7.4z" fill="#fff" stroke="#192230" stroke-width="1.6" stroke-linejoin="round"/><rect x="4.2" y="8" width="23.6" height="4.4" rx="1.8" style="fill:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000)" stroke="#192230" stroke-width="1.6" stroke-linejoin="round"/></g><g class="sk-front"><circle cx="16" cy="8.2" r="1.9" fill="#f4c430" stroke="#192230" stroke-width="1.6" stroke-linejoin="round"/><rect x="5.6" y="15.2" width="20.8" height="11.6" rx="4.8" fill="#192230"/><g class="sk-look"><g class="sk-eyes" fill="#fff"><rect x="9.2" y="17.6" width="3.4" height="6.6" rx="1.7"/><rect x="19.4" y="17.6" width="3.4" height="6.6" rx="1.7"/></g></g></g></g></svg></span>
      <span class="skipper-face" style="--pc:#4fd4ff"><svg viewBox="0 0 32 32" aria-hidden="true" style="--blink:4.4s;--blink-delay:-2.20s;--blink-anim:sk-blink;--face-turn:42s;--face-turn-delay:-37.00s;--dir:-1"><g class="sk-turn"><g transform="rotate(-2 16 16)"><path d="M4 16C8 8 24 8 28 16 24 24 8 24 4 16z" style="fill:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000);stroke:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000)" stroke-width="3" stroke-linejoin="round"/><g class="sk-front"><rect x="7.300000000000001" y="10.2" width="15.399999999999999" height="9.600000000000001" rx="3.5" fill="#192230"/><g class="sk-look"><g class="sk-eyes" fill="#fff"><g transform="translate(10.5 15)"><rect x="-1.6" y="-3.2" width="3.2" height="6.4" rx="1.6"/></g><g transform="translate(19.5 15)"><rect x="-1.6" y="-3.2" width="3.2" height="6.4" rx="1.6"/></g></g></g></g></g></g></svg></span>
      <span class="skipper-face" style="--pc:#34d07c"><svg viewBox="0 0 32 32" aria-hidden="true" style="--blink:7s;--blink-delay:-1.80s;--blink-anim:sk-blink2;--face-turn:36s;--face-turn-delay:-26.00s;--dir:-1"><g class="sk-turn"><g transform="rotate(8 16 16)"><path d="M16 5l10 6v10l-10 6-10-6V11z" style="fill:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000);stroke:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000)" stroke-width="3" stroke-linejoin="round"/><g class="sk-front"><rect x="4.5" y="12.399999999999999" width="21" height="7.6000000000000005" rx="3.5" fill="#192230"/><g class="sk-look"><g class="sk-eyes" fill="#fff"><g transform="translate(9.5 16)"><path d="M-2.8 1.2q2.8-4 5.6 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g><g transform="translate(20.5 16)"><path d="M-2.8 1.2q2.8-4 5.6 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></g></g></g></g></g></g></svg></span>
      <span class="skipper-face" style="--pc:#ffcf3f"><svg viewBox="0 0 32 32" aria-hidden="true" style="--blink:4.4s;--blink-delay:-1.70s;--blink-anim:sk-blink;--face-turn:30s;--face-turn-delay:-28.00s;--dir:-1"><g class="sk-turn"><g transform="rotate(-8 16 16)"><path d="M6 6h20v9c0 6.5-4.5 10.5-10 12.5C10.5 25.5 6 21.5 6 15z" style="fill:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000);stroke:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000)" stroke-width="3" stroke-linejoin="round"/><g class="sk-front"><rect x="6.5" y="7.85" width="21" height="10.3" rx="3.5" fill="#192230"/><g class="sk-look"><g class="sk-eyes" fill="#fff"><g transform="translate(10.5 13)"><rect x="-1.6" y="-3.2" width="3.2" height="6.4" rx="1.6" transform="rotate(22)"/></g><g transform="translate(23.5 13)"><rect x="-1.6" y="-3.2" width="3.2" height="6.4" rx="1.6" transform="rotate(-22)"/></g></g></g></g></g></g></svg></span>
      <span class="skipper-face" style="--pc:#ff7f2a"><svg viewBox="0 0 32 32" aria-hidden="true" style="--blink:4.6s;--blink-delay:-2.10s;--blink-anim:sk-blink;--face-turn:33s;--face-turn-delay:-19.00s;--dir:-1"><g class="sk-turn"><g transform="rotate(-2 16 16)"><path d="M5 22c0-8 2.5-14 6-14 2 0 3 2 5 2s3-2 5-2c3.5 0 6 6 6 14 0 3-1.5 5-4.5 5h-13C6.5 27 5 25 5 22z" style="fill:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000);stroke:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000)" stroke-width="3" stroke-linejoin="round"/><g class="sk-front"><rect x="4.6" y="14.1" width="20.8" height="7.8" rx="3.5" fill="#192230"/><g class="sk-look"><g class="sk-eyes" fill="#fff"><g transform="translate(8.5 18)"><circle r="2.3"/></g><g transform="translate(21.5 18)"><circle r="2.3"/></g></g></g></g></g></g></svg></span>
      <span class="skipper-face" style="--pc:#ff52b0"><svg viewBox="0 0 32 32" aria-hidden="true" style="--blink:5.6s;--blink-delay:-0.90s;--blink-anim:sk-blink;--face-turn:42s;--face-turn-delay:-39.00s;--dir:1"><g class="sk-turn"><g transform="rotate(-4 16 16)"><path d="M5 26V16a11 11 0 0 1 22 0v10z" style="fill:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000);stroke:color-mix(in srgb, var(--pc, var(--project-default)) 72%, #000)" stroke-width="3" stroke-linejoin="round"/><g class="sk-front"><rect x="7.6" y="13.1" width="18.8" height="7.8" rx="3.5" fill="#192230"/><g class="sk-look"><g class="sk-eyes" fill="#fff"><g transform="translate(11.5 17)"><circle r="2.3"/></g><g transform="translate(22.5 17)"><circle r="2.3"/></g></g></g></g></g></g></svg></span>
    </div>
    <!-- /crew -->
  </div>
  <div class="foot"><i></i>Linux · macOS · Open source</div>
</div>
</body>
</html>
